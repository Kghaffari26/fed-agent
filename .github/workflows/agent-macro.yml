# Runs the macro agent on its two SPEC_MACRO.md §9 schedules through agents-core's
# reusable workflow, which restores the `data` branch into public-data/, runs
# `agents-run macro`, commits data/ (state.json, the cost and guard-failure logs)
# back to this branch, force-pushes public-data/ (latest.json, history/, trace.json...)
# to this repo's `data` branch, and notifies the site repo.
name: Macro agent

on:
  schedule:
    # Weekdays 14:00 UTC: after the 8:30am ET release window in both EST and EDT,
    # leaving time for FRED to update.
    - cron: "0 14 * * 1-5"
    # Weekdays 19:30 UTC: FOMC statements come out at 2:00pm ET. The gate job
    # below ends this run immediately (no uv sync, no fetch, no LLM) unless today
    # is a decision day in config/fomc_dates.toml.
    - cron: "30 19 * * 1-5"
  workflow_dispatch: {}

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/fomc_gate.py
            config/fomc_dates.toml
          sparse-checkout-cone-mode: false
      - id: gate
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: python3 scripts/fomc_gate.py >> "$GITHUB_OUTPUT"

  run:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    # run-agent.yml declares no permissions since agents-core v0.2.0: its job gets
    # exactly this grant. contents: write commits data/ and pushes the data branch;
    # issues: write lets ctx.alert open the §10 "statement extraction failed" issue.
    permissions:
      contents: write
      issues: write
    uses: Kghaffari26/agents-core/.github/workflows/run-agent.yml@v0.3.1
    with:
      agent: macro
      max_run_usd: "0.25"
      site_repo: Kghaffari26/agents-hub
      # Kept between runs with actions/cache: the full FRED observation history (so
      # unchanged series skip the observations call), the ETag copies of the Fed feed
      # and calendar, and agents-core's HTTP cache (2xx only; the 30-day series->release
      # lookups and the permanently cached statement pages). public-data/ is no longer
      # cached: run-agent.yml restores it from the data branch.
      cache_path: .cache
    secrets: inherit
