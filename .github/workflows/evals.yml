# The §11 evals as a PR gate, through agents-core's reusable run-evals.yml: runs every
# suite in evals/macro/suites.py (real LLM calls, one total spend cap), appends to
# evals/history.jsonl, writes the score deltas against the previous entries to the job
# summary, and fails the PR if any score drops by more than the threshold.
name: Evals

on:
  pull_request:
    paths:
      - "agents/**"
      - "config/**"
      - "evals/**"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch: {}

jobs:
  evals:
    # run-evals.yml declares no permissions (agents-core v0.3.0): its job gets exactly
    # this grant. It only checks out the repo.
    permissions:
      contents: read
    uses: Kghaffari26/agents-core/.github/workflows/run-evals.yml@v0.3.1
    with:
      # One total cap across all suites (agents-core v0.3.1's total_max_usd); a normal
      # run costs about a third of it. Eval guard failures stay out of data/.
      eval_command: >-
        AGENTS_CORE_GUARD_FAILURES_PATH=evals/results/guard_failures.jsonl
        uv run agents-evals run evals.macro.suites:TEMPLATES evals.macro.suites:BRIEF
        evals.macro.suites:FOMC_READ evals.macro.suites:INVESTIGATOR
      max_usd: "0.60"
      total_max_usd: "0.60"
      regression_threshold: "0.10"
      paths: "agents/* config/* evals/* pyproject.toml uv.lock"
    secrets: inherit
