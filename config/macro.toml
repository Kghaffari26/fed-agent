[settings]
first_run_years = 11
publish_series_years = 10
summarize_minutes = true
use_bls_fallback = false
max_events_to_llm = 8

# -- Inflation ---------------------------------------------------------------

[[indicator]]
id = "cpi"
name = "CPI (all items)"
group = "inflation"
fred_series = "CPIAUCSL"
frequency = "monthly"
primary = "yoy_pct"
secondary = ["mom_pct"]
good_direction = "down"
high_priority = true
thresholds = [3.0, 2.5]

[[indicator]]
id = "core_cpi"
name = "Core CPI"
group = "inflation"
fred_series = "CPILFESL"
frequency = "monthly"
primary = "yoy_pct"
secondary = ["mom_pct", "ann_3m_pct"]
good_direction = "down"
high_priority = false
thresholds = [3.0, 2.5]

[[indicator]]
id = "pce"
name = "PCE price index"
group = "inflation"
fred_series = "PCEPI"
frequency = "monthly"
primary = "yoy_pct"
secondary = []
good_direction = "down"
high_priority = false
thresholds = [3.0, 2.5]

[[indicator]]
id = "core_pce"
name = "Core PCE"
group = "inflation"
fred_series = "PCEPILFE"
frequency = "monthly"
primary = "yoy_pct"
secondary = ["ann_3m_pct"]
good_direction = "down"
high_priority = true
thresholds = [3.0, 2.5, 2.0]

[[indicator]]
id = "breakeven_5y"
name = "5-yr breakeven inflation"
group = "inflation"
fred_series = "T5YIE"
frequency = "daily"
primary = "level"
secondary = []
good_direction = "neutral"
high_priority = false
thresholds = []

# -- Labor --------------------------------------------------------------------

[[indicator]]
id = "unrate"
name = "Unemployment rate"
group = "labor"
fred_series = "UNRATE"
frequency = "monthly"
primary = "level"
secondary = ["change_pp"]
good_direction = "down"
high_priority = true
thresholds = [4.0, 4.5, 5.0]

[[indicator]]
id = "payrolls"
name = "Nonfarm payrolls"
group = "labor"
fred_series = "PAYEMS"
frequency = "monthly"
primary = "mom_diff"
secondary = ["avg_3"]
units_scale = "thousands"
good_direction = "up"
high_priority = true
thresholds = []

[[indicator]]
id = "claims"
name = "Initial jobless claims"
group = "labor"
