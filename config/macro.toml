# -- Release components (the release investigator's get_components tool) -----
#
# Not published as indicators: only the investigator reads them, when a CPI or
# payrolls release triggers it. Same fields as [[indicator]] plus `release`, the
# indicator id whose release they break down. Fetched with the same last_updated
# change detection as the indicators; a failure is a warning, never a failed run.
# Series verified live on 2026-09-27 (scripts/verify_macro_series.py).

[[component]]
release = "cpi"
id = "cpi_shelter"
name = "CPI: shelter"
group = "components"
fred_series = "CUSR0000SAH1"
frequency = "monthly"
primary = "yoy_pct"
secondary = ["mom_pct"]
good_direction = "down"
units = "index"
level_decimals = 1

